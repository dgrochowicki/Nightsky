<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasek nocy — prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#111726;--card:#161D2E;--ink:#E8EBF2;--soft:#95A0B8;--faint:#5A6580;--line:#232B3D;
        --green:#5DE8AB;--amber:#E8B475;--violet:#A794EC;--blue:#7FB8E8}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  .app{max-width:440px;margin:0 auto;padding:22px 20px 40px}

  h1{font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:28px;
    letter-spacing:-.015em;margin:0 0 2px;line-height:1.15}
  .sub{margin:0 0 24px;font-size:13px;color:var(--faint)}

  /* --- pasek --- */
  .strip{position:relative;border-radius:12px;overflow:hidden;background:#05070E;
    touch-action:none;cursor:crosshair;user-select:none}
  .strip svg{display:block;width:100%;height:auto}
  .hours{display:flex;margin-top:7px;padding:0 1px}
  .hours span{flex:1;font-size:10.5px;color:var(--faint);text-align:center}

  /* --- odczyt --- */
  .read{background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:13px 15px;margin-top:14px}
  .read-t{font-size:22px;font-weight:500;letter-spacing:-.02em;line-height:1.1;margin-bottom:3px}
  .read-t em{font-style:normal;font-size:13px;color:var(--faint);font-weight:400;margin-left:8px}
  .read-d{font-size:13.5px;color:var(--soft);line-height:1.45}
  .read-f{display:flex;gap:16px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
  .read-f div{font-size:12.5px;color:var(--faint)}
  .read-f b{display:block;font-size:15px;color:var(--ink);font-weight:500}

  .leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--faint);margin-top:14px}
  .leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

  .note{font-size:13px;color:var(--soft);line-height:1.55;margin-top:26px;
    padding-top:20px;border-top:1px solid var(--line)}

  .dev{border-top:1px dashed var(--line);margin-top:30px;padding-top:18px}
  .dev h2{font-size:12px;font-weight:500;color:var(--faint);margin:0 0 14px}
  .sl{margin-bottom:12px}
  .sl-t{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-bottom:4px}
  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:18px;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:4px;background:#1C2434;border-radius:2px}
  input[type=range]::-moz-range-track{height:4px;background:#1C2434;border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--soft);margin-top:-5.5px;cursor:pointer;border:none}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--soft);border:none;cursor:pointer}
  input[type=range]:focus-visible{outline:2px solid var(--soft);outline-offset:3px}
  .dev input[type=date]{background:#1C2434;border:1px solid var(--line);color:var(--ink);
    font:inherit;font-size:12.5px;padding:6px 9px;border-radius:7px;margin-bottom:14px}
</style>
</head>
<body>
<div class="app">

  <h1>Dzisiejsza noc</h1>
  <p class="sub" id="sub">—</p>

  <div class="strip" id="strip"></div>
  <div class="hours" id="hours"></div>

  <div class="read">
    <div class="read-t" id="rt">—</div>
    <div class="read-d" id="rd">—</div>
    <div class="read-f" id="rf"></div>
  </div>

  <div class="leg">
    <span><i style="background:#7FB8E8"></i>zachmurzenie</span>
    <span><i style="background:#C9D4E8"></i>księżyc nad horyzontem</span>
    <span><i style="background:#E8B475"></i>teraz</span>
  </div>

  <p class="note">Przeciągnij palcem po pasku. Tło to prawdziwa ciemność liczona z pozycji Słońca —
  cztery etapy zmierzchu jako płynne przejście, a nie cztery liczby w tabelce.</p>

  <div class="dev">
    <h2>Panel podglądu</h2>
    <input type="date" id="date">
    <div class="sl"><div class="sl-t"><span>Chmury wieczorem</span><span id="c1-o">70%</span></div>
      <input type="range" id="c1" min="0" max="100" value="70"></div>
    <div class="sl"><div class="sl-t"><span>Chmury nad ranem</span><span id="c2-o">15%</span></div>
      <input type="range" id="c2" min="0" max="100" value="15"></div>
  </div>

</div>

<script>
/* ---------- astronomia (SunCalc, inline) ---------- */
const rad=Math.PI/180,dayMs=864e5,J1970=2440588,J2000=2451545,ecl=rad*23.4397;
const toDays=d=>d.valueOf()/dayMs-0.5+J1970-J2000;
const RA=(l,b)=>Math.atan2(Math.sin(l)*Math.cos(ecl)-Math.tan(b)*Math.sin(ecl),Math.cos(l));
const DC=(l,b)=>Math.asin(Math.sin(b)*Math.cos(ecl)+Math.cos(b)*Math.sin(ecl)*Math.sin(l));
const sid=(d,lw)=>rad*(280.16+360.9856235*d)-lw;
const LAT=53.4285,LON=14.5528,LW=rad*-LON,PHI=rad*LAT;
const altOf=(H,dc)=>Math.asin(Math.sin(PHI)*Math.sin(dc)+Math.cos(PHI)*Math.cos(dc)*Math.cos(H))/rad;
function sunC(d){const M=rad*(357.5291+0.98560028*d);
  const C=rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
  const L=M+C+rad*102.9372+Math.PI;return{dec:DC(L,0),ra:RA(L,0)};}
function moonC(d){const L=rad*(218.316+13.176396*d),M=rad*(134.963+13.064993*d),F=rad*(93.272+13.229350*d);
  const l=L+rad*6.289*Math.sin(M),b=rad*5.128*Math.sin(F);
  return{ra:RA(l,b),dec:DC(l,b),dist:385001-20905*Math.cos(M)};}
const sunAlt=t=>{const d=toDays(t),c=sunC(d);return altOf(sid(d,LW)-c.ra,c.dec);};
const moonAlt=t=>{const d=toDays(t),m=moonC(d);return altOf(sid(d,LW)-m.ra,m.dec);};
function moonIllum(t){const d=toDays(t),m=moonC(d),s=sunC(d),sd=149598000;
  const ph=Math.acos(Math.sin(s.dec)*Math.sin(m.dec)+Math.cos(s.dec)*Math.cos(m.dec)*Math.cos(s.ra-m.ra));
  return (1+Math.cos(Math.atan2(sd*Math.sin(ph),m.dist-sd*Math.cos(ph))))/2;}

function cross(base,fn,target,dir,fromH){
  const s=new Date(base);s.setHours(fromH,0,0,0);let p=fn(s);
  for(let i=1;i<=1200;i++){const t=new Date(s.getTime()+i*6e4),v=fn(t);
    if(dir<0?(p>target&&v<=target):(p<target&&v>=target))return t;p=v;}
  return null;}
const hm=t=>t?String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'):'—';

/* ---------- kolor nieba z wysokości Słońca ---------- */
const STOPS=[[ 6,[ 62, 96,143]],[ 0,[ 44, 71,112]],[ -6,[ 26, 46, 79]],
             [-12,[ 16, 30, 54]],[-18,[  8, 16, 32]],[-90,[  5,  7, 14]]];
function nieboColor(a){
  for(let i=0;i<STOPS.length-1;i++){
    const [h1,c1]=STOPS[i],[h2,c2]=STOPS[i+1];
    if(a<=h1&&a>=h2){
      const f=(h1-a)/(h1-h2);
      return 'rgb('+c1.map((v,k)=>Math.round(v+(c2[k]-v)*f)).join(',')+')';
    }
  }
  return a>6?'rgb(62,96,143)':'rgb(5,7,14)';
}
const ciemnosc=a=>a>-6?0:a>-12?(-a-6)/6*0.55:a>-18?0.55+(-a-12)/6*0.45:1;

/* ---------- planety (opcjonalnie) ---------- */
const AE=typeof Astronomy!=='undefined';
const kierunek=a=>['północy','pn.-wsch.','wschodzie','pd.-wsch.','południu',
  'pd.-zach.','zachodzie','pn.-zach.'][Math.round(a/45)%8];

/* ---------- stan ---------- */
const $=id=>document.getElementById(id);
let T0,T1,N=220,PROBKI=[],SCRUB=null;

function chmuryO(t){
  const c1=+$('c1').value,c2=+$('c2').value;
  const f=(t-T0)/(T1-T0);
  return c1+(c2-c1)*Math.max(0,Math.min(1,f));
}

function build(){
  const base=new Date($('date').value+'T12:00:00');
  $('c1-o').textContent=$('c1').value+'%';
  $('c2-o').textContent=$('c2').value+'%';

  const zachod=cross(base,sunAlt,-0.833,-1,12)||new Date(base.getFullYear(),base.getMonth(),base.getDate(),19,0);
  const wschod=cross(base,sunAlt,-0.833,1,20)||new Date(zachod.getTime()+10*36e5);
  T0=new Date(zachod.getTime()-45*6e4);
  T1=new Date(wschod.getTime()+45*6e4);

  PROBKI=[];
  for(let i=0;i<=N;i++){
    const t=new Date(T0.getTime()+(T1-T0)*i/N);
    PROBKI.push({t, sa:sunAlt(t), ma:moonAlt(t), il:moonIllum(t), ch:chmuryO(t)});
  }

  const zmA=cross(base,sunAlt,-18,-1,12), switA=cross(base,sunAlt,-18,1,20);
  const mW=cross(base,moonAlt,0,1,12), mZ=cross(base,moonAlt,0,-1,12);

  const godz=zmA&&switA?((switA-zmA)/36e5):0;
  $('sub').textContent = 'Szczecin · zachód '+hm(zachod)+' · '+
    (godz>0?'ciemno '+godz.toFixed(1)+' h, od '+hm(zmA):'brak nocy astronomicznej');

  /* --- SVG --- */
  const W=440,H=132,PAS=96;
  let g='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">';

  // tło: kolor nieba, kolumna po kolumnie
  PROBKI.forEach((p,i)=>{
    const x=i*W/N;
    g+='<rect x="'+x.toFixed(2)+'" y="0" width="'+(W/N+0.6).toFixed(2)+'" height="'+PAS+
       '" fill="'+nieboColor(p.sa)+'"/>';
  });

  // zachmurzenie: zasłania niebo od góry
  const cpts=PROBKI.map((p,i)=>(i*W/N).toFixed(1)+','+(p.ch/100*PAS*0.62).toFixed(1));
  g+='<path d="M0,0 L'+cpts.join(' L')+' L'+W+',0 Z" fill="#7FB8E8" opacity=".30"/>';
  g+='<polyline points="'+cpts.join(' ')+'" fill="none" stroke="#7FB8E8" stroke-width="1" opacity=".55"/>';

  // księżyc nad horyzontem: pasek u dołu, jasność = faza
  PROBKI.forEach((p,i)=>{
    if(p.ma>0){
      const x=i*W/N;
      g+='<rect x="'+x.toFixed(2)+'" y="'+(PAS-7)+'" width="'+(W/N+0.6).toFixed(2)+
         '" height="6" fill="#C9D4E8" opacity="'+(0.15+p.il*0.6).toFixed(2)+'"/>';
    }
  });

  // znaczniki
  const mark=(t,txt,col)=>{
    if(!t||t<T0||t>T1) return '';
    const x=(t-T0)/(T1-T0)*W;
    return '<line x1="'+x.toFixed(1)+'" y1="0" x2="'+x.toFixed(1)+'" y2="'+PAS+
      '" stroke="'+col+'" stroke-width="1" opacity=".8"/>'+
      '<text x="'+(x+4).toFixed(1)+'" y="'+(PAS+13)+'" fill="'+col+
      '" font-size="9" font-family="Instrument Sans">'+txt+'</text>';
  };
  g+=mark(zmA,'ciemno','#7FB8E8');
  g+=mark(mW,'księżyc','#C9D4E8');
  g+=mark(mZ,'kon. księżyca','#C9D4E8');

  // teraz
  const now=new Date();
  if(now>=T0&&now<=T1){
    const x=(now-T0)/(T1-T0)*W;
    g+='<line x1="'+x.toFixed(1)+'" y1="0" x2="'+x.toFixed(1)+'" y2="'+PAS+
       '" stroke="#E8B475" stroke-width="1.6"/>';
  }

  // kursor
  if(SCRUB!=null){
    const x=SCRUB*W;
    g+='<line x1="'+x.toFixed(1)+'" y1="0" x2="'+x.toFixed(1)+'" y2="'+PAS+
       '" stroke="#fff" stroke-width="1.4" opacity=".9"/>'+
       '<circle cx="'+x.toFixed(1)+'" cy="6" r="3.5" fill="#fff"/>';
  }

  g+='</svg>';
  $('strip').innerHTML=g;

  // godziny pod paskiem
  let hh='';
  for(let i=0;i<7;i++){
    const t=new Date(T0.getTime()+(T1-T0)*i/6);
    hh+='<span>'+hm(t)+'</span>';
  }
  $('hours').innerHTML=hh;

  odczyt(SCRUB!=null?SCRUB:(now>=T0&&now<=T1?(now-T0)/(T1-T0):0.35));
}

function odczyt(f){
  const i=Math.round(Math.max(0,Math.min(1,f))*N), p=PROBKI[i];
  if(!p) return;
  const c=ciemnosc(p.sa);
  const stan = p.sa>-0.833?'jeszcze dzień' : p.sa>-6?'zmierzch cywilny'
             : p.sa>-12?'zmierzch żeglarski' : p.sa>-18?'zmierzch astronomiczny' : 'noc astronomiczna';

  $('rt').innerHTML=hm(p.t)+'<em>'+stan+'</em>';

  const co=[];
  if(c===0) co.push('za jasno na cokolwiek poza planetami');
  else if(c<0.55) co.push('niebo jeszcze się wypala');
  else co.push('niebo wystarczająco ciemne');
  if(p.ch>75) co.push('ale zachmurzenie zamyka wszystko');
  else if(p.ch>40) co.push('chmury z przerwami');
  else co.push('niebo w zasadzie odsłonięte');
  if(p.ma>0&&p.il>0.5) co.push('księżyc rozjaśnia tło');
  $('rd').textContent=co.join(', ')+'.';

  let f2=[['Słońce',p.sa.toFixed(1)+'°'],['Chmury',Math.round(p.ch)+'%'],
          ['Księżyc',p.ma>0?Math.round(p.il*100)+'%':'pod horyz.']];
  if(AE){
    try{
      const obs=new Astronomy.Observer(LAT,LON,0);
      const eq=Astronomy.Equator(Astronomy.Body.Venus,p.t,obs,true,true);
      const h=Astronomy.Horizon(p.t,obs,eq.ra,eq.dec,'normal');
      if(h.altitude>0) f2.push(['Wenus',h.altitude.toFixed(0)+'° na '+kierunek(h.azimuth)]);
    }catch(e){}
  }
  $('rf').innerHTML=f2.map(([k,v])=>'<div>'+k+'<b>'+v+'</b></div>').join('');
}

/* ---------- interakcja ---------- */
const strip=$('strip');
function pos(ev){
  const r=strip.getBoundingClientRect();
  const x=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
  return Math.max(0,Math.min(1,x/r.width));
}
let drag=false;
const start=ev=>{drag=true;SCRUB=pos(ev);build();ev.preventDefault();};
const move =ev=>{if(!drag)return;SCRUB=pos(ev);build();ev.preventDefault();};
const end  =()=>{drag=false;};
strip.addEventListener('pointerdown',start);
strip.addEventListener('pointermove',move);
window.addEventListener('pointerup',end);

['c1','c2','date'].forEach(id=>$(id).addEventListener('input',build));
const t=new Date();
$('date').value=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
build();
</script>
</body>
</html>

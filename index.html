<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nad tobą dziś</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#111726;--card:#161D2E;--ink:#E8EBF2;--soft:#95A0B8;--faint:#5A6580;--line:#232B3D;
        --green:#5DE8AB;--amber:#E8B475;--violet:#A794EC;--blue:#7FB8E8}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  .app{max-width:440px;margin:0 auto;padding:22px 20px 40px;overflow:hidden}

  .head h1{font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:28px;
    letter-spacing:-.015em;margin:0 0 2px;line-height:1.15}
  .head p{margin:0 0 24px;font-size:13px;color:var(--faint)}
  .lede{font-family:"Newsreader",Georgia,serif;font-size:20px;font-weight:300;line-height:1.42;
    margin:0 0 26px;padding-bottom:22px;border-bottom:1px solid var(--line);max-width:30ch}

  /* ---- timeline ---- */
  .tl{position:relative;padding-left:62px}
  .tl::before{content:"";position:absolute;left:53px;top:12px;bottom:14px;width:1px;background:var(--line)}
  .ev{position:relative;width:100%;text-align:left;background:none;border:none;padding:0 0 22px;
    color:inherit;font:inherit;cursor:pointer;display:block}
  .ev:last-child{padding-bottom:6px}
  .ev .time{display:block;position:absolute;left:-62px;top:0;width:44px;text-align:right;font-size:13.5px;color:var(--faint)}
  .ev .dot{display:block;position:absolute;left:-13px;top:7px;width:9px;height:9px;border-radius:50%;
    background:var(--bg);border:1.5px solid var(--faint)}
  .ev .box{display:block;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;
    transition:border-color .18s}
  .ev:hover .box,.ev:focus-visible .box{border-color:var(--soft)}
  .ev:focus-visible{outline:none}
  .ev h3{display:flex;margin:0;font-size:15.5px;font-weight:500;display:flex;justify-content:space-between;
    align-items:center;gap:9px}
  .ev h3 em{font-style:normal;color:var(--faint);font-size:19px;font-weight:400;line-height:1}
  .ev p{margin:3px 0 0;font-size:13px;color:var(--soft);line-height:1.45}
  .tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:10px;font-weight:500;margin-left:6px;vertical-align:1px}

  .zzz{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
  .yearlink{display:block;width:100%;margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 14px;color:var(--ink);font:inherit;font-size:15px;font-weight:500;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .yearlink:hover{border-color:var(--soft)}
  .yearlink em{font-style:normal;color:var(--faint);font-size:19px}
  .yearlink small{display:block;font-size:12.5px;color:var(--soft);font-weight:400;margin-top:2px}
  .ychart{width:100%;height:auto;margin:6px 0 4px}
  .ylegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--faint);margin-bottom:26px}
  .ylegend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
  .yrow{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .yrow:last-child{border-bottom:none}
  .yrow .yd{color:var(--faint)}
  .yrow b{font-weight:500;display:block}
  .yrow span{color:var(--soft);font-size:12.5px}
  .zzz h2{font-size:12px;font-weight:500;color:var(--faint);margin:0 0 10px}
  .zrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px;color:var(--faint)}
  .zrow b{font-weight:400;color:var(--soft)}
  .zrow span{text-align:right;flex-shrink:0}

  /* ---- podstrona ---- */
  .back{background:none;border:none;color:var(--soft);font:inherit;font-size:14px;padding:0 0 22px;
    cursor:pointer;display:flex;align-items:center;gap:7px}
  .back:hover{color:var(--ink)}
  .back:focus-visible{outline:2px solid var(--soft);outline-offset:3px;border-radius:4px}
  .d-h{font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:32px;letter-spacing:-.015em;
    margin:0 0 6px;line-height:1.1}
  .d-when{font-size:13.5px;color:var(--faint);margin:0 0 22px}
  .d-lead{font-size:17px;line-height:1.5;margin:0 0 26px;max-width:29ch}

  .big{display:flex;align-items:baseline;gap:11px;margin-bottom:24px}
  .big b{font-size:52px;font-weight:500;letter-spacing:-.04em;line-height:1}
  .big span{font-size:13.5px;color:var(--soft);max-width:16ch;line-height:1.35}

  .sec{margin-bottom:26px}
  .sec h2{font-size:12px;font-weight:500;color:var(--faint);margin:0 0 13px}
  .row{display:grid;grid-template-columns:minmax(78px,auto) 1fr minmax(46px,auto);gap:11px;
    align-items:center;margin-bottom:10px;font-size:13.5px}
  .row-n{color:var(--soft)}
  .bar{height:6px;background:#1C2434;border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:4px}
  .row-v{text-align:right;color:var(--faint)}

  .facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .f{background:var(--card);padding:12px 13px}
  .f-k{font-size:11.5px;color:var(--faint);line-height:1.3;margin-bottom:2px}
  .f-v{font-size:16px;font-weight:500;letter-spacing:-.01em}
  .src{font-size:11.5px;color:var(--faint);line-height:1.5;margin-top:22px}

  /* ---- panel ---- */
  .dev{border-top:1px dashed var(--line);margin-top:40px;padding-top:18px}
  .dev h2{font-size:12px;font-weight:500;color:var(--faint);margin:0 0 3px}
  .dev>p{font-size:12px;color:var(--faint);margin:0 0 14px;line-height:1.5}
  .sl{margin-bottom:12px}
  .sl-t{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-bottom:4px}
  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:18px;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:4px;background:#1C2434;border-radius:2px}
  input[type=range]::-moz-range-track{height:4px;background:#1C2434;border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--soft);margin-top:-5.5px;cursor:pointer;border:none}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--soft);border:none;cursor:pointer}
  input[type=range]:focus-visible{outline:2px solid var(--soft);outline-offset:3px}
  .dev input[type=date]{background:#1C2434;border:1px solid var(--line);color:var(--ink);
    font:inherit;font-size:12.5px;padding:6px 9px;border-radius:7px;margin-bottom:14px}

  .fade{animation:in .22s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div id="view"></div>

  <div class="dev">
    <h2>Panel podglądu</h2>
    <p>Daty, godziny, księżyc, radianty rojów — liczone naprawdę. Kp i chmury wymagają sieci, więc są na suwakach.</p>
    <input type="date" id="date">
    <div class="sl"><div class="sl-t"><span>Kp</span><span id="kp-o">2.0</span></div>
      <input type="range" id="kp" min="0" max="9" step="0.3" value="2"></div>
    <div class="sl"><div class="sl-t"><span>Chmury niskie</span><span id="lo-o">40%</span></div>
      <input type="range" id="lo" min="0" max="100" value="40"></div>
    <div class="sl"><div class="sl-t"><span>Chmury wysokie</span><span id="hi-o">45%</span></div>
      <input type="range" id="hi" min="0" max="100" value="45"></div>
  </div>
</div>

<script>
/* ================= astronomia ================= */
const rad=Math.PI/180,dayMs=864e5,J1970=2440588,J2000=2451545,ecl=rad*23.4397;
const toDays=d=>d.valueOf()/dayMs-0.5+J1970-J2000;
const RA=(l,b)=>Math.atan2(Math.sin(l)*Math.cos(ecl)-Math.tan(b)*Math.sin(ecl),Math.cos(l));
const DC=(l,b)=>Math.asin(Math.sin(b)*Math.cos(ecl)+Math.cos(b)*Math.sin(ecl)*Math.sin(l));
const sid=(d,lw)=>rad*(280.16+360.9856235*d)-lw;
const LAT=53.4285,LON=14.5528,LW=rad*-LON,PHI=rad*LAT;
const altOf=(H,dc)=>Math.asin(Math.sin(PHI)*Math.sin(dc)+Math.cos(PHI)*Math.cos(dc)*Math.cos(H))/rad;
const aziOf=(H,dc)=>(Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(PHI)-Math.tan(dc)*Math.cos(PHI))/rad+180)%360;
function sunC(d){const M=rad*(357.5291+0.98560028*d);
  const C=rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
  const L=M+C+rad*102.9372+Math.PI;return{dec:DC(L,0),ra:RA(L,0)};}
function moonC(d){const L=rad*(218.316+13.176396*d),M=rad*(134.963+13.064993*d),F=rad*(93.272+13.229350*d);
  return{ra:RA(L+rad*6.289*Math.sin(M),rad*5.128*Math.sin(F)),
         dec:DC(L+rad*6.289*Math.sin(M),rad*5.128*Math.sin(F)),dist:385001-20905*Math.cos(M)};}
const sunAlt=t=>{const d=toDays(t),c=sunC(d);return altOf(sid(d,LW)-c.ra,c.dec);};
const sunAzi=t=>{const d=toDays(t),c=sunC(d);return aziOf(sid(d,LW)-c.ra,c.dec);};
const moonAlt=t=>{const d=toDays(t),m=moonC(d);return altOf(sid(d,LW)-m.ra,m.dec);};
function moonIllum(t){const d=toDays(t),m=moonC(d),s=sunC(d),sd=149598000;
  const ph=Math.acos(Math.sin(s.dec)*Math.sin(m.dec)+Math.cos(s.dec)*Math.cos(m.dec)*Math.cos(s.ra-m.ra));
  return (1+Math.cos(Math.atan2(sd*Math.sin(ph),m.dist-sd*Math.cos(ph))))/2;}
function objAlt(t,raH,decD){const d=toDays(t);
  return altOf(sid(d,LW)-raH*15*rad, decD*rad);}
const MAGLAT=(()=>{const pLa=80.65*rad,pLo=-72.68*rad;
  return Math.asin(Math.sin(LAT*rad)*Math.sin(pLa)+Math.cos(LAT*rad)*Math.cos(pLa)*Math.cos(LON*rad-pLo))/rad;})();
const KP_NEEDED=(66.5-MAGLAT)/2.05;

function cross(base,fn,target,dir){
  const s=new Date(base);s.setHours(12,0,0,0);let p=fn(s);
  for(let i=1;i<=1080;i++){const t=new Date(s.getTime()+i*6e4),v=fn(t);
    if(dir<0?(p>target&&v<=target):(p<target&&v>=target))return t;p=v;}
  return null;}
const hm=t=>t?String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'):'—';

const ROJE=[
 {n:'Kwadrantydy',m:1,d:3,zhr:110,ra:15.33,dec:49},{n:'Lirydy',m:4,d:22,zhr:18,ra:18.07,dec:34},
 {n:'Eta Akwarydy',m:5,d:6,zhr:50,ra:22.53,dec:-1},{n:'Perseidy',m:8,d:12,zhr:100,ra:3.07,dec:58},
 {n:'Draconidy',m:10,d:8,zhr:10,ra:17.47,dec:54},{n:'Orionidy',m:10,d:21,zhr:20,ra:6.33,dec:16},
 {n:'Leonidy',m:11,d:17,zhr:15,ra:10.13,dec:22},{n:'Geminidy',m:12,d:14,zhr:120,ra:7.47,dec:32},
 {n:'Ursydy',m:12,d:22,zhr:10,ra:14.47,dec:75}];
function nextRoj(base){let best=null;
  for(const r of ROJE)for(const y of [base.getFullYear()-1,base.getFullYear(),base.getFullYear()+1]){
    const p=new Date(y,r.m-1,r.d,23,0,0),dni=Math.round((p-base)/dayMs);
    if(dni>=-2&&(!best||dni<best.dni))best={...r,dni,peak:p};}
  return best;}

/* ================= model ================= */
let S={view:'list',id:null};

function model(){
  const base=new Date(document.getElementById('date').value+'T12:00:00');
  const kp=+document.getElementById('kp').value,
        lo=+document.getElementById('lo').value,
        hi=+document.getElementById('hi').value;
  const zachod=cross(base,sunAlt,-0.833,-1), zmC=cross(base,sunAlt,-6,-1),
        zmA=cross(base,sunAlt,-18,-1), swit=cross(new Date(base-dayMs),sunAlt,-18,1),
        mW=cross(base,moonAlt,0,1), mZ=cross(base,moonAlt,0,-1);
  const illum=moonIllum(zachod||base), roj=nextRoj(base);
  const chmuryOk=1-Math.pow(Math.min(100,lo+hi*0.35)/100,1.4);
  const zasieg=Math.max(0,Math.min(1,(MAGLAT-(66.5-2.05*kp)+1.5)/3));
  const wagaKs=0.40*(1-Math.min(kp/7,1));
  const bezKs=(zmA&&moonAlt(zmA)>0)?1-wagaKs*illum:1;
  const zorza=zasieg*chmuryOk*bezKs;
  const jakosc=Math.max(0,Math.min(100,(100-Math.abs(hi-55)*1.4)*(1-Math.pow(lo/100,1.2))));
  const radAlt=roj&&zmA?objAlt(new Date(zmA.getTime()+3*36e5),roj.ra,roj.dec):null;
  return {base,kp,lo,hi,zachod,zmC,zmA,swit,mW,mZ,illum,roj,radAlt,
          chmuryOk,zasieg,bezKs,zorza,jakosc,
          faza:illum<0.06?'nów':illum<0.45?'sierp':illum<0.6?'kwadra':illum<0.94?'garb':'pełnia'};
}

const bar=(n,v,c)=>'<div class="row"><span class="row-n">'+n+'</span><span class="bar">'+
  '<i style="width:'+Math.max(2,v*100)+'%;background:'+c+'"></i></span>'+
  '<span class="row-v">'+Math.round(v*100)+'%</span></div>';
const facts=a=>'<div class="facts">'+a.map(([k,v])=>
  '<div class="f"><div class="f-k">'+k+'</div><div class="f-v">'+v+'</div></div>').join('')+'</div>';

/* ================= lista ================= */
function renderList(m){
  const zorzaOn=m.kp>=KP_NEEDED-1.2;
  let lede;
  if(zorzaOn) lede='Zorza jest w zasięgu. Reszta nocy może poczekać.';
  else if(m.roj&&Math.abs(m.roj.dni)<=1) lede='Maksimum roju '+m.roj.n+'. Ciemno od '+hm(m.zmA)+'.';
  else if(m.jakosc>65) lede='Najlepszy będzie zachód o '+hm(m.zachod)+'.';
  else if(m.illum<0.15) lede='Nów. Najciemniejsze niebo w miesiącu, od '+hm(m.zmA)+' do '+hm(m.swit)+'.';
  else lede='Spokojna noc. Zachód o '+hm(m.zachod)+', ciemno od '+hm(m.zmA)+'.';

  const ev=[];
  if(zorzaOn) ev.push({t:m.zmA,id:'zorza',h:'Zorza polarna',c:'var(--green)',
    tag:['w zasięgu','var(--green)'],p:'Kp '+m.kp.toFixed(1)+', próg dla Szczecina to '+KP_NEEDED.toFixed(1)+'.'});
  ev.push({t:m.zachod,id:'zachod',h:'Zachód słońca',c:'var(--amber)',
    tag:m.jakosc>65?['dobry kolor','var(--amber)']:null,
    p:'Azymut '+Math.round(sunAzi(m.zachod))+'°. Złota godzina do '+hm(m.zmC)+'.'});
  ev.push({t:m.zmA,id:'noc',h:'Ciemne niebo',c:'var(--blue)',
    p:'Zmierzch astronomiczny. Ciemno do '+hm(m.swit)+'.'});
  if(m.roj&&Math.abs(m.roj.dni)<=2) ev.push({t:m.zmA,id:'roj',h:'Rój '+m.roj.n,c:'var(--violet)',
    tag:['maksimum','var(--violet)'],p:'Do '+m.roj.zhr+' meteorów na godzinę przy idealnym niebie.'});
  if(m.mW) ev.push({t:m.mW,id:'ksiezyc',h:'Wschód księżyca',c:'var(--soft)',
    p:Math.round(m.illum*100)+'% tarczy. '+(m.illum>0.5?'Rozjaśni resztę nocy.':'Nie przeszkodzi.')});
  else if(m.mZ) ev.push({t:m.mZ,id:'ksiezyc',h:'Zachód księżyca',c:'var(--soft)',
    p:'Potem niebo już bez księżyca.'});
  ev.sort((a,b)=>a.t-b.t);

  const z=[];
  if(!zorzaOn) z.push(['Zorza polarna','Kp '+m.kp.toFixed(1)+' z '+KP_NEEDED.toFixed(1)]);
  if(!m.roj||Math.abs(m.roj.dni)>2) z.push(['Roje meteorów',m.roj?m.roj.n+' za '+m.roj.dni+' dni':'—']);
  const ms=m.base.getMonth();
  z.push(['Obłoki srebrzyste',(ms>=4&&ms<=7)?'sezon trwa':'wracają w maju']);
  z.push(['Przeloty ISS','wymaga danych na żywo']);

  return '<div class="fade"><div class="head"><h1>Nad Szczecinem</h1><p>'+
    m.base.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'})+
    '</p></div><p class="lede">'+lede+'</p><div class="tl">'+
    ev.map(x=>'<button class="ev" data-id="'+x.id+'"><span class="time">'+hm(x.t)+'</span>'+
      '<span class="dot" style="border-color:'+x.c+'"></span><span class="box">'+
      '<h3><span>'+x.h+(x.tag?'<span class="tag" style="background:'+x.tag[1]+'22;color:'+x.tag[1]+'">'+x.tag[0]+'</span>':'')+
      '</span><em>›</em></h3><p>'+x.p+'</p></span></button>').join('')+
    '</div><div class="zzz"><h2>Dziś śpi</h2>'+
    z.map(([a,b])=>'<div class="zrow"><b>'+a+'</b><span>'+b+'</span></div>').join('')+'</div>'+
    '<button class="yearlink" id="toyear"><span>Cały rok<small>Co wraca co roku i kiedy</small></span><em>\u203A</em></button></div>';
}

/* ================= podstrony ================= */
function renderDetail(id,m){
  const back='<button class="back" id="back">‹ Wróć do nocy</button>';
  let h='',when='',lead='',body='';

  if(id==='zorza'){
    const km=Math.round(((66.5-2.05*m.kp)-MAGLAT)*111/50)*50;
    h='Zorza polarna';when='Najlepsze okno: '+hm(m.zmA)+' – '+hm(m.swit);
    lead=m.zorza>0.45?'Warunki są dobre. Patrz nisko nad północnym horyzontem.':
         m.zasieg<0.15?'Owal zorzy kończy się około '+km+' km na północ stąd.':
         m.chmuryOk<0.25?'Aktywność wystarczy, ale niebo nad tobą jest zakryte.':
         'Warunki na granicy. Aparat złapie więcej niż oko.';
    body='<div class="big"><b style="color:var(--green)">'+Math.round(m.zorza*100)+
      '%</b><span>szansa zobaczenia gołym okiem tej nocy</span></div>'+
      '<div class="sec"><h2>Co składa się na tę liczbę</h2>'+
      bar('Zasięg owalu',m.zasieg,'var(--green)')+bar('Czyste niebo',m.chmuryOk,'var(--green)')+
      bar('Bez księżyca',m.bezKs,'var(--green)')+'</div>'+
      '<div class="sec"><h2>Dane do weryfikacji</h2>'+facts([
      ['Kp teraz',m.kp.toFixed(1)],['Kp potrzebne',KP_NEEDED.toFixed(1)],
      ['Szer. magnetyczna',MAGLAT.toFixed(1)+'°'],['Granica owalu',(66.5-2.05*m.kp).toFixed(1)+'°'],
      ['Chmury niskie',m.lo+'%'],['Chmury wysokie',m.hi+'%'],
      ['Księżyc',Math.round(m.illum*100)+'%'],['Nad horyzontem',m.zmA&&moonAlt(m.zmA)>0?'tak':'nie']])+
      '</div><p class="src">Kp z NOAA SWPC, aktualizacja co minutę. Zachmurzenie z Open-Meteo. Szerokość magnetyczna liczona z przybliżenia dipolowego, więc granica owalu w kilometrach jest orientacyjna.</p>';
  }

  if(id==='zachod'){
    h='Zachód słońca';when=hm(m.zachod)+' · azymut '+Math.round(sunAzi(m.zachod))+'°';
    lead=m.jakosc>65?'Zapowiada się mocny kolor.':m.jakosc>35?'Może być przyzwoicie.':
         m.lo>70?'Niskie chmury zasłonią wszystko.':m.hi<15?'Niebo za czyste — nie ma na czym się odbić.':'Raczej blado.';
    body='<div class="big"><b style="color:var(--amber)">'+Math.round(m.jakosc)+
      '</b><span>ocena koloru w skali do 100</span></div>'+
      '<div class="sec"><h2>Dlaczego</h2>'+
      bar('Chmury wysokie',Math.max(0,1-Math.abs(m.hi-55)/70),'var(--amber)')+
      bar('Czysty horyzont',1-Math.pow(m.lo/100,1.2),'var(--amber)')+
      '</div><div class="sec"><h2>Okna światła</h2>'+facts([
      ['Złota godzina','do '+hm(m.zmC)],['Niebieska godzina',hm(m.zmC)+' – '+hm(cross(m.base,sunAlt,-12,-1))],
      ['Azymut zachodu',Math.round(sunAzi(m.zachod))+'°'],['Kierunek',(()=>{const a=sunAzi(m.zachod);
        return a<250?'pd.-zach.':a<280?'zachód':'pn.-zach.';})()]])+
      '</div><p class="src">Wysokie chmury odbijają światło zza horyzontu i dają kolor — najlepiej przy pokryciu około 50%. Niskie chmury blokują promienie, zanim dotrą do tych wysokich. Dlatego dwie liczby działają w przeciwne strony.</p>';
  }

  if(id==='noc'){
    const bezKsOd=m.mZ&&m.mZ>m.zmA?m.mZ:m.zmA;
    h='Ciemne niebo';when=hm(m.zmA)+' – '+hm(m.swit);
    const godz=((m.swit-m.zmA)/36e5);
    lead='Masz '+godz.toFixed(1)+' h prawdziwej ciemności astronomicznej.';
    body='<div class="sec"><h2>Etapy zmierzchu</h2>'+facts([
      ['Zachód',hm(m.zachod)],['Cywilny (−6°)',hm(m.zmC)],
      ['Żeglarski (−12°)',hm(cross(m.base,sunAlt,-12,-1))],['Astronomiczny (−18°)',hm(m.zmA)]])+
      '</div><div class="sec"><h2>Najlepsze okno</h2>'+facts([
      ['Ciemno od',hm(m.zmA)],['Ciemno do',hm(m.swit)],
      ['Bez księżyca od',m.mZ&&m.mZ>m.zmA?hm(m.mZ):(moonAlt(m.zmA)>0?'księżyc świeci całą noc':hm(m.zmA))],
      ['Zaświetlenie',Math.round(m.illum*100)+'% tarczy']])+
      '</p><p class="src">Zmierzch astronomiczny to moment, w którym Słońce schodzi 18° pod horyzont i rozproszone światło przestaje wpływać na najsłabsze obiekty. Liczone z pozycji Słońca dla twoich współrzędnych, bez żadnych danych z sieci.</p>';
  }

  if(id==='ksiezyc'){
    h='Księżyc';when=m.faza+' · '+Math.round(m.illum*100)+'% tarczy';
    lead=m.illum>0.6?'Rozjaśni niebo i zabierze słabsze obiekty.':
         m.illum<0.15?'Praktycznie nie przeszkadza.':'Przeszkadza umiarkowanie.';
    body='<div class="big"><b>'+Math.round(m.illum*100)+'%</b><span>oświetlonej tarczy</span></div>'+
      '<div class="sec"><h2>Dziś</h2>'+facts([
      ['Wschód',hm(m.mW)],['Zachód',hm(m.mZ)],
      ['Faza',m.faza],['Nad horyzontem o '+hm(m.zmA),m.zmA&&moonAlt(m.zmA)>0?Math.round(moonAlt(m.zmA))+'°':'pod horyzontem']])+
      '</div><p class="src">Faza i pozycja liczone z uproszczonych elementów orbity — dokładność rzędu kilku minut na wschodach i zachodach, w zupełności wystarczająca do planowania obserwacji.</p>';
  }

  if(id==='roj'&&m.roj){
    const r=m.roj, widoczne=Math.round(r.zhr*Math.max(0,Math.sin(Math.max(0,m.radAlt||0)*rad))*(1-m.illum*0.6)*(1-m.lo/130));
    h='Rój '+r.n;when=r.dni===0?'Maksimum dziś w nocy':r.dni>0?'Maksimum za '+r.dni+' dni':'Maksimum '+(-r.dni)+' dni temu';
    lead='Realnie możesz liczyć na około '+widoczne+' meteorów na godzinę.';
    body='<div class="big"><b style="color:var(--violet)">'+widoczne+'</b><span>na godzinę, przy twoich warunkach</span></div>'+
      '<div class="sec"><h2>Co obniża liczbę</h2>'+
      bar('Wysokość radiantu',Math.max(0,Math.sin(Math.max(0,m.radAlt||0)*rad)),'var(--violet)')+
      bar('Bez księżyca',1-m.illum*0.6,'var(--violet)')+
      bar('Czyste niebo',1-m.lo/130,'var(--violet)')+
      '</div><div class="sec"><h2>Szczegóły</h2>'+facts([
      ['ZHR w ideale',r.zhr+'/h'],['Radiant o 3 w nocy',(m.radAlt||0).toFixed(0)+'°'],
      ['Maksimum',r.peak.toLocaleDateString('pl-PL',{day:'numeric',month:'long'})],
      ['Najlepiej patrzeć','nad ranem']])+
      '</div><p class="src">ZHR to liczba teoretyczna: radiant w zenicie, niebo bez księżyca i świateł. Wysokość radiantu liczona z jego współrzędnych i twojej szerokości geograficznej — im niżej nad horyzontem, tym mniej meteorów wpada w pole widzenia.</p>';
  }

  return '<div class="fade">'+back+'<h1 class="d-h">'+h+'</h1><p class="d-when">'+when+
    '</p><p class="d-lead">'+lead+'</p>'+body+'</div>';
}


/* ================= widok roku ================= */
function nocLength(day){           // godziny ciemnosci astronomicznej
  let mins=0;
  const s=new Date(day); s.setHours(12,0,0,0);
  for(let i=0;i<144;i++){ if(sunAlt(new Date(s.getTime()+i*10*6e4))<-18) mins+=10; }
  return mins/60;
}
function renderYear(m){
  const Y=m.base.getFullYear();
  const days=[], start=new Date(Y,0,1);
  const isLeap=(Y%4===0&&Y%100!==0)||Y%400===0, N=isLeap?366:365;
  let maxN=0;
  for(let i=0;i<N;i++){
    const d=new Date(Y,0,1+i), h=nocLength(d);
    days.push(h); if(h>maxN) maxN=h;
  }
  const W=366, H=86;
  const pts=days.map((h,i)=>(i*W/N).toFixed(1)+','+(H-h/Math.max(maxN,1)*H).toFixed(1));
  const area='M0,'+H+' L'+pts.join(' L')+' L'+W+','+H+' Z';

  // nowie: lokalne minima oswietlenia
  const nowie=[];
  for(let i=1;i<N-1;i++){
    const a=moonIllum(new Date(Y,0,1+i-1,22)),b=moonIllum(new Date(Y,0,1+i,22)),c=moonIllum(new Date(Y,0,1+i+1,22));
    if(b<a&&b<=c&&b<0.04) nowie.push(i);
  }
  const dayOf=(mo,d)=>Math.round((new Date(Y,mo-1,d)-start)/dayMs);

  // sezon oblokow srebrzystych: 15 V - 15 VIII
  const nlc0=dayOf(5,15), nlc1=dayOf(8,15);

  let svg='<svg class="ychart" viewBox="0 0 '+W+' '+(H+18)+'" xmlns="http://www.w3.org/2000/svg">';
  svg+='<rect x="'+(nlc0*W/N)+'" y="0" width="'+((nlc1-nlc0)*W/N)+'" height="'+H+'" fill="#7FB8E8" opacity=".07"/>';
  svg+='<path d="'+area+'" fill="#7FB8E8" opacity=".22"/>';
  nowie.forEach(i=>{svg+='<circle cx="'+(i*W/N)+'" cy="'+(H+7)+'" r="1.8" fill="#5A6580"/>';});
  ROJE.forEach(r=>{const i=dayOf(r.m,r.d), x=i*W/N, big=r.zhr>=100;
    svg+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+H+'" stroke="'+(big?'#A794EC':'#3A4459')+'" stroke-width="'+(big?1.4:0.9)+'"/>';});
  for(let mo=0;mo<12;mo++){const x=dayOf(mo+1,1)*W/N;
    svg+='<text x="'+(x+3)+'" y="'+(H+15)+'" fill="#5A6580" font-size="8" font-family="Instrument Sans">'+
      ['S','L','M','K','M','C','L','S','W','P','L','G'][mo]+'</text>';}
  svg+='</svg>';

  // lista cyklu
  const rows=[];
  ROJE.filter(r=>r.zhr>=15).forEach(r=>rows.push([
    new Date(Y,r.m-1,r.d).toLocaleDateString('pl-PL',{day:'numeric',month:'short'}),
    'Rój '+r.n, 'ZHR do '+r.zhr+'/h · radiant '+r.dec+'°']));
  rows.push([nlc0>=0?'15 maj – 15 sie':'','Obłoki srebrzyste','Sezon mezosferyczny. Szczecin leży w pasie 50–70°.']);
  rows.push(['21 cze','Najkrótsza noc','Brak nocy astronomicznej od połowy maja do końca lipca.']);
  rows.push(['wrz i mar','Sezon zorzowy','Wokół równonocy burze geomagnetyczne są statystycznie częstsze.']);
  rows.push(['21 gru','Najdłuższa noc','Około '+maxN.toFixed(1)+' h ciemności astronomicznej.']);
  rows.sort((a,b)=>0);

  return '<div class="fade"><button class="back" id="back">\u2039 Wróć do nocy</button>'+
    '<h1 class="d-h">Rok nad Szczecinem</h1>'+
    '<p class="d-when">'+Y+' · '+N+' nocy</p>'+
    '<p class="d-lead">Wykres pokazuje, ile godzin prawdziwej ciemności masz każdej nocy. Latem spada do zera.</p>'+
    svg+
    '<div class="ylegend">'+
      '<span><i style="background:#7FB8E8;opacity:.5"></i>godziny ciemności</span>'+
      '<span><i style="background:#A794EC"></i>roje meteorów</span>'+
      '<span><i style="background:#7FB8E8;opacity:.25"></i>obłoki srebrzyste</span>'+
      '<span><i style="background:#5A6580;border-radius:50%"></i>nów</span>'+
    '</div>'+
    '<div class="sec"><h2>Co wraca co roku</h2>'+
    rows.map(([d,t,s])=>'<div class="yrow"><span class="yd">'+d+'</span><span><b>'+t+'</b><span>'+s+'</span></span></div>').join('')+
    '</div><p class="src">Długość nocy, fazy księżyca i wysokości radiantów liczone z pozycji Słońca i Księżyca dla twoich współrzędnych. Daty maksimów rojów są stałe w kalendarzu z dokładnością do doby — dokładne godziny w UT publikuje co roku IMO.</p></div>';
}

/* ================= router ================= */
function draw(){
  const m=model();
  document.getElementById('kp-o').textContent=m.kp.toFixed(1);
  document.getElementById('lo-o').textContent=m.lo+'%';
  document.getElementById('hi-o').textContent=m.hi+'%';
  const v=document.getElementById('view');
  v.innerHTML = S.view==='list' ? renderList(m) : S.view==='year' ? renderYear(m) : renderDetail(S.id,m);
  if(S.view==='list'){
    v.querySelectorAll('.ev').forEach(b=>b.addEventListener('click',()=>{
      S={view:'detail',id:b.dataset.id}; draw(); window.scrollTo(0,0);}));
    document.getElementById('toyear').addEventListener('click',()=>{
      S={view:'year',id:null}; draw(); window.scrollTo(0,0);});
  } else {
    document.getElementById('back').addEventListener('click',()=>{
      S={view:'list',id:null}; draw(); window.scrollTo(0,0);});
  }
}
const t=new Date();
document.getElementById('date').value=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
['date','kp','lo','hi'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
draw();
</script>
